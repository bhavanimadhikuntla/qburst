spring.application.name=api-gateway

server.port=8080

# =========================
# EUREKA
# =========================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true


# =========================
# JOB SERVICE
# =========================

spring.cloud.gateway.server.webmvc.routes[0].id=job-service

spring.cloud.gateway.server.webmvc.routes[0].uri=lb://JOB-SERVICE

spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/jobs/**


# =========================
# APPLICATION SERVICE
# =========================

spring.cloud.gateway.server.webmvc.routes[1].id=application-service

spring.cloud.gateway.server.webmvc.routes[1].uri=lb://APPLICATION-SERVICE

spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/applications/**


# =========================
# CONTACT SERVICE
# =========================

spring.cloud.gateway.server.webmvc.routes[2].id=contact-service

spring.cloud.gateway.server.webmvc.routes[2].uri=lb://CONTACT-SERVICE

spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/contact/**


# =========================
# AUTH SERVICE
# =========================

spring.cloud.gateway.server.webmvc.routes[3].id=auth-service

spring.cloud.gateway.server.webmvc.routes[3].uri=lb://AUTH-SERVICE

spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/auth/**


# =========================
# CORS
# =========================

spring.cloud.gateway.server.webmvc.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173

spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS

spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedHeaders=*

spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowCredentials=true